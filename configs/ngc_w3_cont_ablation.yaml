version: 1
run_name: ngc_w3_cont_ablation
mode: smolvla-primary

pool: pool/ngc_step1_scale200
candidates_dir: runs/ngc_w3_pilot_candidates/candidates
# Overridden per temperature via --output-dir
output_dir: runs/ngc_w3_cont_ablation

sample:
  strategy: explicit
  # OFT-positive early ADEQUATE spatial state (t0=10, rem=270; OFT 8/8)
  state_keys:
    - sp1_c3da4b196dca67cb4f845a7ffc4fcfe3

candidates:
  k: 8
  chunk_length: 10
  action_dim: 7
  temperature: 0.7
  policy_hash: 71d9563c8295284acba8fc2d5c19de000d6fe9ba58a406832af7ef3d221ed52f

adapter:
  policy_path: ckpts/smolvla_libero
  tokenizer_path: ckpts/SmolVLM2-500M-Instruct
  device: cuda
  num_steps: 10
  n_action_steps: 10
  observation_height: 360
  observation_width: 360
  # Overridden by --continuation-temperature
  continuation_temperature: 0.5

adaptive:
  protocol_version: wilson-onesided-alpha-spend-v1
  sidedness: one-sided
  confidence: 0.95
  threshold: 0.5
  first_stage_rollouts: 6
  total_rollouts: 20
  alpha_first: 0.01
  alpha_final: 0.04
  set_a_min_good_candidates: 3

scheduler:
  # Intentionally omit root → output_dir/scheduler (isolation per temp)
  max_attempts: 3
  lease_seconds: 3600
  worker: cont-ablation-worker

oracle:
  protocol: rase-oracle
  protocol_version: 1
  endpoint: tcp://127.0.0.1:5555
  request_timeout_ms: 60000
