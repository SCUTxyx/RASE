version: 1
run_name: ngc_w7_heldout24_screen
mode: smolvla-screen

pool: pool/ngc_w5_l1_l2_camera_robot
candidates_dir: runs/ngc_w7_heldout24_candidates_t07
output_dir: runs/ngc_w7_heldout24_smol_screen_t07

sample:
  strategy: stratified
  per_cell: 6
  sample_seed: 20260728
  selection: random
  strata: [dim, level]
  distinct_episodes: true
  dims: [camera, robot]
  suites: [Spatial, Object, Goal, Long]
  levels: [1, 2]
  episode_outcomes: [failure]
  min_remaining_steps: 100
  excluded_episode_keys_json: runs/ngc_w6_l1_l2_state_keys.json

protocol:
  phase: heldout_screen
  cohort: failure_challenge_heldout
  conditioning: smolvla_episode_outcome=failure
  expected_n_states: 24
  formal_set_labels: false
  report: candidate_hits_only
  candidate_rollouts: 1
  note: >-
    Frozen validation cohort excluding every W6 pilot state. State-level paired
    outcomes are primary; candidate outcomes are descriptive only.

candidates:
  k: 8
  chunk_length: 10
  action_dim: 7
  temperature: 0.7
  policy_hash: 71d9563c8295284acba8fc2d5c19de000d6fe9ba58a406832af7ef3d221ed52f

adapter:
  policy_path: ckpts/smolvla_libero
  tokenizer_path: ckpts/SmolVLM2-500M-Instruct
  device: cuda
  num_steps: 10
  n_action_steps: 10
  observation_height: 360
  observation_width: 360
  continuation_temperature: 0.5

adaptive:
  first_stage_rollouts: 1
  total_rollouts: 1

scheduler:
  max_attempts: 3
  lease_seconds: 3600
  worker: w7-heldout24-screen

oracle:
  protocol: rase-oracle
  protocol_version: 1
  endpoint: tcp://127.0.0.1:5555
  request_timeout_ms: 60000
