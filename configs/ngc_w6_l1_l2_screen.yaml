version: 1
run_name: ngc_w6_l1_l2_screen
mode: smolvla-screen

pool: pool/ngc_w5_l1_l2_camera_robot
candidates_dir: runs/ngc_w6_l1_l2_candidates_t07
output_dir: runs/ngc_w6_l1_l2_screen_t07

sample:
  strategy: stratified
  per_cell: 2
  sample_seed: 20260727
  selection: random
  # Cohort A is explicitly conditioned on primary-policy failure. Do not call it
  # outcome-balanced or use it for clean-regret estimates.
  strata: [dim, level]
  distinct_episodes: true
  dims: [camera, robot]
  suites: [Spatial, Object, Goal, Long]
  levels: [1, 2]
  episode_outcomes: [failure]
  min_remaining_steps: 100

protocol:
  phase: screen
  cohort: failure_challenge
  conditioning: smolvla_episode_outcome=failure
  expected_n_states: 8
  formal_set_labels: false
  report: candidate_hits_only
  candidate_rollouts: 1
  note: >-
    This is a failure-conditioned coverage/policy-matrix gate, not a population
    rate or Wilson Set certification. Clean-regret controls are a separate cohort.

candidates:
  k: 8
  chunk_length: 10
  action_dim: 7
  temperature: 0.7
  policy_hash: 71d9563c8295284acba8fc2d5c19de000d6fe9ba58a406832af7ef3d221ed52f

adapter:
  policy_path: ckpts/smolvla_libero
  tokenizer_path: ckpts/SmolVLM2-500M-Instruct
  device: cuda
  num_steps: 10
  n_action_steps: 10
  observation_height: 360
  observation_width: 360
  continuation_temperature: 0.5

adaptive:
  first_stage_rollouts: 1
  total_rollouts: 1

scheduler:
  max_attempts: 3
  lease_seconds: 3600
  worker: w6-l1-l2-screen

oracle:
  protocol: rase-oracle
  protocol_version: 1
  endpoint: tcp://127.0.0.1:5555
  request_timeout_ms: 60000
